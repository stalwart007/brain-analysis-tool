[project]
name = "cogniswarm-server"
version = "0.1.0"
description = "CogniSwarm backend — ingest, cognitive modelling, twin swarm orchestration."

# Not cosmetic. `random.binomialvariate` (virality.py, the Galton-Watson
# offspring draw) is 3.12+, and nothing else declared a floor — so a clone on
# 3.11 installed cleanly and then crashed at runtime, inside a simulation,
# rather than failing at install time with a legible message.
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "openai>=1.50,<2.0",
    "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
